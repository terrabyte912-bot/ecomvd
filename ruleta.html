    -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  h1 { margin: 0; padding: .6vmin 4vmin; border-radius: 99px; background: #FAFCF7; color: #1F5C36; font-size: 5vmin; }
  .rueda { position: relative; width: 64vmin; height: 64vmin; cursor: pointer; }
  .rueda svg { display: block; width: 100%; height: 100%; transition: transform 4.5s cubic-bezier(.15, .85, .25, 1); }
  .flecha { position: absolute; left: 50%; top: -2.5vmin; z-index: 1; width: 0; height: 0; margin-left: -3vmin;
    border: 3vmin solid transparent; border-top: 6vmin solid #1C1C1E; border-bottom: 0; }
  #premio { margin: 0; min-height: 7vmin; box-sizing: border-box; padding: .6vmin 4vmin; border-radius: 99px; background: #FAFCF7; font-size: 5vmin; font-weight: 800; color: #1F5C36; text-align: center; }
  #premio:empty { visibility: hidden; }
  button { font: inherit; font-size: 5vmin; font-weight: 800; padding: 1.5vmin 8vmin; min-height: 44px; border: 0;
    border-radius: 99px; background: #1C1C1E; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<h1>Ruleta EcoMVD</h1>
<div class="rueda" id="rueda">
  <div class="flecha"></div>
  <svg id="svg" viewBox="-100 -100 200 200" role="img" aria-label="Ruleta de premios"></svg>
</div>
<p id="premio" aria-live="polite"></p>
<button id="girar" type="button">¡Girar!</button>
<script>
  // [premio, fondo, letra]. Cada semilla sale dos veces, con su color, y nunca pegada a sí misma.
  var ZANAHORIA = ['Semillas de\nzanahoria', '#E07A38', '#14231A'];
  var ESPINACA = ['Semillas de\nespinaca', '#1F5C36', '#fff'];
  var ARVEJAS = ['Semillas de\narvejas', '#A6D987', '#14231A'];
  var PREMIOS = [
    ZANAHORIA, ESPINACA, ['Bolsa de\nmateriales\nreciclados', '#C9E9B0', '#14231A'], ARVEJAS,
    ['Sticker', '#3B8351', '#fff'], ZANAHORIA, ['Suerte para\nla próxima', '#F0F7E8', '#14231A'], ESPINACA,
    ['¡Girá\notra vez!', '#1C1C1E', '#fff'], ARVEJAS
  ];
  var svg = document.getElementById('svg');
  var boton = document.getElementById('girar');
  var premio = document.getElementById('premio');
  var paso = 360 / PREMIOS.length, giro = 0, girando = false;

  function dibujar(tag, attrs) {
    var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function punto(grados) {
    var r = grados * Math.PI / 180;
    return (95 * Math.cos(r)).toFixed(2) + ' ' + (95 * Math.sin(r)).toFixed(2);
  }
  // El casillero i queda centrado a i·paso grados de arriba, en sentido horario.
  PREMIOS.forEach(function (p, i) {
    var desde = i * paso - paso / 2 - 90;
    svg.appendChild(dibujar('path', { d: 'M0 0 L' + punto(desde) + ' A95 95 0 0 1 ' + punto(desde + paso) + ' Z',
      fill: p[1], stroke: '#fff', 'stroke-width': 1.5 }));
    var lineas = p[0].split('\n');
    var texto = dibujar('g', { transform: 'rotate(' + i * paso + ')', fill: p[2],
      'font-size': lineas.length > 2 ? 6.8 : lineas.length > 1 ? 7.6 : 9, 'font-weight': 800, 'text-anchor': 'middle' });
    var centro = lineas.length > 2 ? -69 : -68;
    lineas.forEach(function (linea, j) {
      var t = dibujar('text', { x: 0, y: centro + (j - (lineas.length - 1) / 2) * 9 });
      t.textContent = linea;
      texto.appendChild(t);
    });
    svg.appendChild(texto);
  });
  svg.appendChild(dibujar('circle', { r: 97, fill: 'none', stroke: '#A6D987', 'stroke-width': 4 }));
  svg.appendChild(dibujar('circle', { r: 17, fill: '#fff', stroke: '#1F5C36', 'stroke-width': 2.5 }));
  var centro = dibujar('text', { y: 2.5, 'font-size': 7, 'font-weight': 800, 'text-anchor': 'middle', fill: '#1F5C36' });
  centro.textContent = 'EcoMVD';
  svg.appendChild(centro);

  // En la tablet: pantalla completa con el primer toque, y que la pantalla no se apague.
  var bloqueo = null;
  function noApagar() {
    if (navigator.wakeLock && (!bloqueo || bloqueo.released)) {
      navigator.wakeLock.request('screen').then(function (b) { bloqueo = b; }).catch(function () {});
    }
  }
  function pantallaCompleta() {
    var el = document.documentElement, pedir = el.requestFullscreen || el.webkitRequestFullscreen;
    if (pedir && !(document.fullscreenElement || document.webkitFullscreenElement)) {
      var r = pedir.call(el);
      if (r && r.catch) r.catch(function () {});
    }
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) noApagar(); });
  noApagar();

  function girar() {
    pantallaCompleta();
    noApagar();
    if (girando) return;
    girando = true;
    boton.disabled = true;
    premio.textContent = '';
    giro += 5 * 360 + Math.random() * 360;
    // Que nunca frene justo sobre la línea entre dos casilleros: ahí no se ve cuál salió.
    var borde = ((360 - giro % 360) % 360 + paso / 2) % paso;
    if (borde < 3) giro -= 3;
    if (borde > paso - 3) giro += 3;
    svg.style.transform = 'rotate(' + giro + 'deg)';
  }
  // El premio es el casillero que quedó abajo de la flecha.
  svg.addEventListener('transitionend', function () {
    var i = Math.round((360 - giro % 360) % 360 / paso) % PREMIOS.length;
    var nombre = PREMIOS[i][0].split('\n').join(' ');
    premio.textContent = /otra vez|Suerte/.test(nombre) ? nombre : '¡Te tocó: ' + nombre + '!';
    girando = false;
    boton.disabled = false;
  });
  boton.addEventListener('click', girar);
  document.getElementById('rueda').addEventListener('click', girar);
</script>
</body>
</html>
